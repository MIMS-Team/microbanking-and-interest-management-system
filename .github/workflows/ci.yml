name: CI - Automated Testing & Verification

on:
  push:
    branches:
      - main
      - Ravindu-feature/auth
      - '**'
  pull_request:
    branches:
      - main
      - Ravindu-feature/auth

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-and-backend-checks:
    name: Lint, Typecheck & Automated Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microbanking-and-interest-management-system

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'microbanking-and-interest-management-system/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting Check
        run: npm run lint

      - name: TypeScript Static Type Checking
        run: npx tsc --noEmit --skipLibCheck

      - name: Run Automated Vitest Test Suite (86 Integration, Security & Unit Tests)
        run: npm test
        env:
          NODE_ENV: test
          VITEST: 'true'

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'

  mysql-production-verification:
    name: Disposable MySQL 8.0 Integration Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: ./microbanking-and-interest-management-system

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'microbanking-and-interest-management-system/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Disposable MySQL Integration Suite
        run: npx vitest run src/lib/server/mysql-disposable.test.ts
        env:
          NODE_ENV: test
          VITEST: 'true'
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: 3306
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ci_test_password
          TEST_MYSQL_REQUIRED: 'true'

  browser-e2e-verification:
    name: Real Browser Playwright End-to-End Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microbanking-and-interest-management-system

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'microbanking-and-interest-management-system/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Seed Development Database
        run: node scripts/seed-dev.mjs

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: 'true'
          NODE_ENV: development
          E2E_TEST: 'true'
          EMAIL_PROVIDER: console

      - name: Upload Test Results & Failure Artifacts (Traces & Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            microbanking-and-interest-management-system/test-results/
            microbanking-and-interest-management-system/playwright-report/
          retention-days: 14


