name: MySQL integration and authentication verification
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_disposable_only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: '3306'
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: ci_disposable_only
      TEST_MYSQL_REQUIRED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y mysql-client openssl
      - run: npx playwright install chromium --with-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:auth
      - run: npx vitest run lib/server/mysql-disposable.test.ts
      - run: npm run test:banking
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:e2e:production
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
