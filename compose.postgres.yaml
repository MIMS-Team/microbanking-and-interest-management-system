# Isolated test server, never started by the application or used for real data.
services:
  postgres-verification:
    image: postgres:17
    environment:
      POSTGRES_USER: mims_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set a disposable PostgreSQL password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mims_test -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
