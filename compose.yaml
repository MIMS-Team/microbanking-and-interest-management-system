# Optional shared PostgreSQL server for your team. These are LOCAL demo credentials.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mims
      POSTGRES_USER: mims
      POSTGRES_PASSWORD: mims_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mims_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mims -d mims"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mims_postgres:
