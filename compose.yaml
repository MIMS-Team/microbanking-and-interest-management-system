# Optional isolated verification server. No volume from an existing database.
# Supply a fresh password in the shell; this file is not started by the app.
services:
  mysql-verification:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_PASSWORD:?Set a disposable MySQL password}
    ports:
      - "127.0.0.1:${TEST_MYSQL_PORT:-33307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
